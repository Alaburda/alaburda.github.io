project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!website-redesign-review.md"

execute:
  cache: true

website:
  title: "Paulius Alaburda"
  site-url: "https://alaburda.github.io"
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: blog.qmd
        text: Writing
      - href: talks.qmd
        text: Talks
      - href: projects.qmd
        text: Projects
      - href: resume.qmd
        text: Resume
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/Alaburda/alaburda.github.io
        aria-label: GitHub
      - icon: rss
        href: blog.xml
        aria-label: RSS Feed
  page-footer:
    left: "Paulius Alaburda"
    right: "[GitHub](https://github.com/Alaburda/alaburda.github.io) · [RSS](blog.xml)"

format:
  html:
    theme: default
    css: styles.css
    # Quarto's page grid - not the CSS - decides the content lane. Widening
    # body-width reclaims the dead outer gutters; styles.css then caps the
    # prose measure so text stays readable while figures, code and tables
    # use the full lane.
    grid:
      body-width: 940px
      margin-width: 250px
      sidebar-width: 250px
    toc: true
    code-overflow: wrap
    highlight-style: github



